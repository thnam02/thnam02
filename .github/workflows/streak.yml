name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/streak.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: zients/github-readme-streak-stats@v2
        with:
          options: >-
            user=thnam02&theme=github-dark-blue&hide_border=true&background=161B22&ring=58A6FF&fire=3FB950&currStreakLabel=58A6FF&currStreakNum=C9D1D9&sideLabels=C9D1D9&sideNums=F0F6FC&dates=8B949E&stroke=30363D&disable_animations=true&starting_year=2026&hide_current_streak=false&card_width=495&card_height=170
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebalance streak card
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path("profile/streak.svg")
          svg = path.read_text(encoding="utf-8")
          svg = re.sub(
              r"(<text x='82\.5' y='[^']+' fill='[^']+' font-family='[^']+' )font-size='28'( font-weight='700'>)",
              r"\1font-size='30'\2",
              svg,
          )
          svg = re.sub(
              r"(<text x='412\.5' y='[^']+' fill='[^']+' font-family='[^']+' )font-size='28'( font-weight='700'>)",
              r"\1font-size='30'\2",
              svg,
          )
          svg = re.sub(
              r"(<circle cx='247\.5' cy='[^']+' )r='40'",
              r"\1r='36'",
              svg,
              count=1,
          )
          svg = svg.replace(
              "stroke='#161B22' stroke-width='1' opacity='0.35'",
              "stroke='#30363D' stroke-width='1' opacity='0.55'",
          )
          path.write_text(svg, encoding="utf-8")
          PY

      - name: Commit streak stats
        run: |
          git add profile/streak.svg
          if git diff --cached --quiet -- profile/streak.svg; then
            echo "No streak SVG changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update streak stats"
          git push
