name: Update streak stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/streak.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: zients/github-readme-streak-stats@v2
        with:
          options: >-
            user=thnam02&theme=github-dark-blue&hide_border=true&background=161B22&ring=58A6FF&fire=58A6FF&currStreakLabel=8B949E&currStreakNum=F0F6FC&sideLabels=8B949E&sideNums=F0F6FC&dates=8B949E&stroke=161B22&disable_animations=true&starting_year=2026&hide_current_streak=true&card_width=495&card_height=170
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git add profile/streak.svg
          if git diff --cached --quiet -- profile/streak.svg; then
            echo "No streak SVG changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update streak stats"
          git push
